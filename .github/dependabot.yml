version: 2
updates:
  # Python — repo root (uv, not pip: uv.lock is present. The pip ecosystem
  # updater does not understand uv.lock -- same distinction found on
  # agentic-travel-booking-system's dependabot.yml, PR #81, 2026-08-15).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies

  # Node — demo
  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies

  # GitHub Actions — keep action versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies
